# Kotlin Configuration
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
# Gradle Build Performance & Caching
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.tooling.parallel=true
# AndroidX & Package Management
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableAppCompileTimeRClass=true
android.uniquePackageNames=true
# Android Build Features & Defaults
android.defaults.buildfeatures.resvalues=false
android.sdk.defaultTargetSdkToCompileSdkIfUnset=true
android.usesSdkInManifest.disallowed=true
android.builtInKotlin=true
# R8 Optimization & Dependency Constraints
android.r8.optimizedResourceShrinking=true
android.r8.strictFullModeForKeepRules=false
android.dependency.useConstraints=true
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false